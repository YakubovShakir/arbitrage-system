[package]
name = "arbitrage-system"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
prost = "0.12"
data-encoding = "2.9.0"
futures-util = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
json = "0.12.4"
reqwest = "0.12.23"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28.0",  features = ["native-tls"]}

[build-dependencies]
prost-build = "0.12"